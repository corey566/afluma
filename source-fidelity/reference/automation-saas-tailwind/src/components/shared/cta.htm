<!-- cta section  -->
<section class="pt-20 md:pt-25 lg:pt-39">
  <div class="main-container">
    <div
      data-ns-animate
      data-delay="0.1"
      class="relative lg:pt-60 md:pt-39 pt-20 md:pb-39 pb-20 md:px-16 px-5 bg-white rounded-2xl overflow-hidden"
    >
      <!-- globe bg  -->
      <figure
        data-ns-animate
        data-delay="0.2"
        class="size-[639px] absolute top-15 left-1/2 -translate-x-1/2 z-10"
      >
        <img
          src="./images/ns-img-26.svg"
          alt="globe"
          class="size-full object-cover"
        />
      </figure>

      <div class="space-y-8 relative z-20">
        <div class="space-y-5 text-center">
          <div data-ns-animate data-delay="0.3">
            <Component
              src="../shared/ui/badge/badge-primary.htm"
              badge-text="CTA"
            />
          </div>

          <div class="space-y-3">
            <h2 data-text-reveal data-delay="0.4" class="max-w-[650px] mx-auto">
              Stop doing manual work. Start automating everything.
            </h2>
            <p
              data-text-reveal
              data-delay="0.5"
              class="text-background-14/60 max-w-[550px] mx-auto"
            >
              Replace repetitive tasks with smart automation that runs in the
              background, saving time, reducing errors, and letting you focus on
              real growth.
            </p>
          </div>
        </div>

        <a
          data-ns-animate
          data-delay="0.6"
          href="./contact.html"
          class="flex justify-center"
        >
          <Component
            src="../shared/ui/button/button-primary.htm"
            button-text="Create automation"
            button-class=" mx-auto md:mx-0 md:w-fit!"
            button-text-class="text-center text-nowrap max-sm:flex-1  max-sm:pr-8!"
          />
        </a>
      </div>

      <!-- bottom gradient -->

      <div
        class="w-full absolute bottom-0 left-0 lg:h-[390px] h-[300px] z-10 rounded-b-[20px]"
        style="
          background: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0) -59.75%,
            rgba(255, 255, 255, 0.5) -10.1%,
            rgba(255, 255, 255, 0.8) 30.12%,
            #fff 70.98%
          );
        "
      ></div>
    </div>
  </div>
</section>
