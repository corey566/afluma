<!-- Login section -->
<section class="pt-20 md:pt-25 lg:pt-39">
  <div class="main-container">
    <div class="flex flex-col items-center gap-10 md:gap-16">
      <div class="space-y-2 text-center md:space-y-3">
        <h2
          data-text-reveal
          data-delay="0.1"
          class="text-heading-2 text-secondary"
        >
          Login to your account
        </h2>
        <p
          data-text-reveal
          data-delay="0.2"
          class="mx-auto max-w-[420px] text-tagline-1 text-secondary/60"
        >
          Let's explore how Nexsas can support your goals with AI-driven
          solutions.
        </p>
      </div>

      <div
        data-ns-animate
        data-delay="0.3"
        class="w-full max-w-[413px] rounded-xl bg-background-8 p-2"
      >
        <form
          action="#"
          class="flex flex-col items-center gap-8 rounded-lg bg-background-7 px-8 py-6 backdrop-blur-[60px] md:py-8"
        >
          <div class="flex w-full flex-col gap-8">
            <div class="flex flex-col gap-4">
              <fieldset class="space-y-2">
                <label
                  for="login-email"
                  class="block text-tagline-2 text-white/90"
                >
                  Your email
                </label>
                <input
                  type="email"
                  id="login-email"
                  name="email"
                  placeholder="Email address"
                  class="w-full rounded-md border border-stroke-3/25 bg-transparent px-4.5 py-3 text-white/90 placeholder:text-white/55 focus:outline-none"
                  required
                  aria-label="Your email"
                />
              </fieldset>
              <fieldset class="space-y-2">
                <label
                  for="login-password"
                  class="block text-tagline-2 text-white/90"
                >
                  Password
                </label>
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  placeholder="At least 8 characters"
                  class="w-full rounded-md border border-stroke-3/25 bg-transparent px-4.5 py-3 text-white/90 placeholder:text-white/55 focus:outline-none"
                  required
                  minlength="8"
                  aria-label="Password"
                />
              </fieldset>
            </div>

            <component
              src="../shared/ui/button/button-white.htm"
              button-text="Login"
              button-class="w-full md:w-auto"
              button-text-class="text-center text-nowrap flex-1 px-0! mr-8!"
            />

            <div class="relative flex items-center justify-center gap-2">
              <span
                class="block h-px w-[43px] shrink-0 bg-[linear-gradient(270deg,rgba(255,255,255,0.4)_0%,rgba(255,255,255,0)_79%)]"
              ></span>
              <span class="text-tagline-4 text-white/80">Or</span>
              <span
                class="block h-px w-[43px] shrink-0 bg-[linear-gradient(90deg,rgba(255,255,255,0.4)_0%,rgba(255,255,255,0)_79%)]"
              ></span>
            </div>

            <!-- Social buttons -->
            <Component src="./social-buttons.htm" />
          </div>

          <p class="text-center text-tagline-3 text-white/90">
            Don't have an account?
            <a href="./signup.html" class="underline text-white/70">Sign up</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
