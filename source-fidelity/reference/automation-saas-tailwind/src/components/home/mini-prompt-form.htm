<aside
  data-mini-prompt-form
  class="fixed bottom-6 left-1/2 z-40 w-full max-w-[350px] shadow-[0_8px_12px_0_rgba(16,24,40,0.16)] -translate-x-1/2 translate-y-full rounded-full lg:max-w-[700px]"
>
  <div
    data-colored-border
    data-shine-color="#A585FF ,#FFC2AD ,#FF9472,#F2709C,#F9EB57"
    class="mx-auto flex w-full items-center justify-between gap-x-2.5 rounded-full bg-white p-3"
  >
    <div class="flex items-center justify-center gap-x-1.5 sm:gap-x-2.5">
      <span
        class="bg-background-3 hover:bg-secondary/10 flex size-9 cursor-pointer items-center justify-center rounded-full transition-colors duration-400 ease-in-out"
      >
        <Component
          src="../../components/shared/icon/mic.htm"
          class="size-5 stroke-secondary"
        />
      </span>
      <!-- file upload  -->
      <Component
        src="../../components/shared/icon/file-upload.htm"
        class="bg-background-3 hover:bg-secondary/10 relative flex size-9 cursor-pointer items-center justify-center rounded-full transition-colors duration-400 ease-in-out"
      />
    </div>

    <fieldset
      class="w-full max-w-[250px] lg:max-w-[502px]"
      data-typewriter
      data-duration="2"
    >
      <input
        type="text"
        name="prompt"
        id="prompt"
        data-typewriter-text
        autocomplete="off"
        class="w-full text-secondary placeholder:text-secondary/50 text-tagline-2 focus-visible:outline-none"
        placeholder="Describe your product or service"
      />
    </fieldset>

    <div class="flex items-center justify-center gap-x-1.5 sm:gap-x-2.5">
      <button
        type="button"
        class="group flex w-13 h-10 rounded-full cursor-pointer items-center justify-center transition-all duration-400 ease-in-out hover:scale-102 bg-secondary"
      >
        <span class="relative size-6 overflow-hidden">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            class="absolute translate-x-0 transition-transform duration-400 ease-in-out group-hover:translate-x-full size-6 fill-white"
          >
            <path d="M8 5H10V7H8V5Z" />
            <path d="M11 8H13V10H11V8Z" />
            <path d="M14 11H16V13H14V11Z" />
            <path d="M11 14H13V16H11V14Z" />
            <path d="M8 17H10V19H8V17Z" />
          </svg>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            class="absolute -translate-x-full size-6 fill-white transition-transform duration-400 ease-in-out group-hover:translate-x-0"
          >
            <path d="M8 5H10V7H8V5Z" />
            <path d="M11 8H13V10H11V8Z" />
            <path d="M14 11H16V13H14V11Z" />
            <path d="M11 14H13V16H11V14Z" />
            <path d="M8 17H10V19H8V17Z" />
          </svg>
        </span>
      </button>
    </div>
  </div>
</aside>
