<!-- hero section  -->
<section class="pt-[190px] relative overflow-hidden" data-slightly-move-root>
  <!-- video background   -->
  <video
    class="absolute inset-0 w-full 2k:h-[104%] h-full object-cover -z-10"
    autoplay
    muted
    loop
    playsinline
  >
    <source src="/videos/hero-video.mp4" type="video/mp4" />
  </video>

  <div class="main-container relative z-10">
    <div class="md:space-y-18 space-y-9 text-center">
      <div class="md:space-y-[70px] space-y-8">
        <!-- avatar and text content  -->
        <div class="space-y-6">
          <!-- avatar group -->
          <div
            class="flex items-center justify-center max-w-[254px] mx-auto gap-x-3"
          >
            <div
              data-ns-animate
              data-delay="0.1"
              data-direction="left"
              data-offset="50"
              data-instant
              class="flex items-center justify-center -space-x-3.5"
            >
              <figure
                class="size-11 rounded-full overflow-hidden outline-2 outline-background-2"
                data-ns-avatar
                data-avatar-direction="left"
                data-avatar-delay="0.1"
              >
                <img
                  src="./images/ns-avatar-11.jpg"
                  alt="avatar-1"
                  class="size-full object-cover rounded-full"
                />
              </figure>
              <figure
                class="size-11 rounded-full overflow-hidden outline-2 outline-background-2"
                data-ns-avatar
                data-avatar-direction="left"
                data-avatar-delay="0.2"
              >
                <img
                  src="./images/ns-avatar-13.jpg"
                  alt="avatar-2"
                  class="size-full object-cover rounded-full"
                />
              </figure>
              <figure
                class="size-11 rounded-full overflow-hidden outline-2 outline-background-2"
                data-ns-avatar
                data-avatar-direction="left"
                data-avatar-delay="0.3"
              >
                <img
                  src="./images/ns-avatar-14.jpg"
                  alt="avatar-3"
                  class="size-full object-cover rounded-full"
                />
              </figure>
            </div>
            <p
              data-ns-animate
              data-delay="0.2"
              data-direction="right"
              data-offset="50"
              data-instant
              class="text-tagline-2 text-left text-background-14/80 max-w-[142px] mx-auto"
            >
              2,000+teams shipping faster this week.
            </p>
          </div>

          <!-- text content  -->
          <div class="space-y-4">
            <h1 data-text-reveal data-delay="0.3" class="max-w-[950px] mx-auto">
              Automate your workflows eliminate manual tasks.
            </h1>
            <p data-text-reveal data-delay="0.4" class="max-w-[500px] mx-auto">
              Connect your tools, design smart workflows, and automate
              repetitive work — so your business runs on autopilot.
            </p>
          </div>
        </div>

        <!-- btns  -->
        <div
          data-ns-animate
          data-delay="0.3"
          class="flex items-center md:flex-row flex-col justify-center md:gap-x-5 gap-y-3"
        >
          <a href="./pricing.html" class="w-[70%] md:w-auto">
            <Component
              src="../shared/ui/button/button-primary.htm"
              button-text="Start free trial"
              button-class="w-full md:w-auto"
              button-text-class="text-center text-nowrap max-sm:flex-1  max-sm:pr-8!"
            />
          </a>

          <div class="w-[70%] md:w-auto cursor-pointer" data-auth-modal-open>
            <Component
              src="../shared/ui/button/button-secondary.htm"
              button-text="Book demo"
              button-class="outline-0! w-full md:w-auto"
              button-text-class="text-center text-nowrap max-sm:flex-1  max-sm:pr-8!"
            />
          </div>
        </div>
      </div>

      <!-- hero banner img  -->
      <figure
        data-ns-animate
        data-delay="0.4"
        data-instant
        class="w-full xl:h-[825px] md:h-[650px] backdrop-blur-[20px] h-[350px] rounded-[20px] overflow-hidden"
      >
        <img
          src="./images/ns-img-3.png"
          alt="hero-banner-img"
          class="size-full"
        />
      </figure>
    </div>

    <!-- left elements   -->

    <figure
      data-ns-animate
      data-delay="0.5"
      data-direction="left"
      data-offset="50"
      class="absolute hidden md:block z-30 2xl:left-[-8%] xl:left-[-5%] left-[2%] top-[57%] xl:top-[50%] h-14 will-change-transform"
      data-slightly-move
      data-shift="12"
    >
      <img
        src="./images/ns-img-27.svg"
        alt="left-elements"
        class="size-full object-cover"
      />
    </figure>

    <!-- right elements   -->
    <figure
      data-ns-animate
      data-delay="0.6"
      data-direction="right"
      data-offset="50"
      class="absolute hidden md:block 2xl:right-[-5%] xl:right-[-3%] right-[8%] top-[59%] xl:top-[42%] h-14 z-30 will-change-transform"
      data-slightly-move
      data-shift="10"
    >
      <img
        src="./images/ns-img-28.svg"
        alt="right-elements"
        class="size-full object-cover"
      />
    </figure>
  </div>

  <!-- bottom gradient  -->
  <figure
    data-ns-animate
    data-delay="0.5"
    data-instant
    class="w-full absolute xl:h-[700px] md:h-[600px] h-[500px] -bottom-1 left-0 z-20"
  >
    <img
      src="./images/bottom-gradient.svg"
      alt="bottom-gradient"
      class="size-full object-cover"
    />
  </figure>
</section>
