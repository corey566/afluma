<div data-auth-modal-root>
  <div
    data-auth-modal-overlay
    class="fixed inset-0 z-9999 hidden items-center justify-center p-4"
    aria-hidden="true"
  >
    <div
      data-auth-modal-backdrop
      class="absolute inset-0 z-0 bg-secondary/35 backdrop-blur-[14px]"
    ></div>

    <div
      data-auth-modal-panel
      class="bg-white relative z-20 w-full max-w-[360px] rounded-3xl border border-stroke-3 p-6"
    >
      <button
        type="button"
        data-auth-modal-close
        data-auth-modal-item
        class="bg-secondary/10 absolute top-4 right-4 z-30 flex size-8 cursor-pointer items-center justify-center rounded-full text-secondary transition-colors duration-300 hover:text-secondary/80"
        aria-label="Close auth modal"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          class="size-4 fill-none stroke-current"
        >
          <path
            d="M18 6L6 18M6 6l12 12"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <div data-auth-modal-item class="mb-7 text-center">
        <h3 class="text-heading-5 text-secondary">Welcome back</h3>
        <p class="text-tagline-3 mt-2 text-secondary/60">
          Sign in to your account to continue
        </p>
      </div>

      <div data-auth-modal-item class="mb-7 grid grid-cols-5 gap-2.5">
        <button
          type="button"
          data-auth-provider="google"
          class="bg-secondary/10 text-tagline-3 flex h-10 w-full items-center justify-center rounded-2xl text-secondary/80 transition-transform duration-300 hover:scale-95"
        >
          <Component
            src="src/components/shared/icon/google-icon.htm"
            class="size-5"
          />
        </button>
        <button
          type="button"
          data-auth-provider="apple"
          class="bg-secondary/10 text-tagline-3 flex h-10 w-full items-center justify-center rounded-2xl text-secondary/80 transition-transform duration-300 hover:scale-95"
        >
          <Component
            src="src/components/shared/icon/apple-icon.htm"
            class="size-5 text-secondary"
          />
        </button>
        <button
          type="button"
          data-auth-provider="microsoft"
          class="bg-secondary/10 text-tagline-3 flex h-10 w-full items-center justify-center rounded-2xl text-secondary/80 transition-transform duration-300 hover:scale-95"
        >
          <Component
            src="src/components/shared/icon/microsoft-icon.htm"
            class="size-4.5"
          />
        </button>
        <button
          type="button"
          data-auth-provider="github"
          class="bg-secondary/10 text-tagline-3 flex h-10 w-full items-center justify-center rounded-2xl text-secondary/80 transition-transform duration-300 hover:scale-95"
        >
          <Component
            src="src/components/shared/icon/github-icon.htm"
            class="size-5 text-secondary"
          />
        </button>
        <button
          type="button"
          data-auth-provider="twitter"
          class="bg-secondary/10 text-tagline-3 flex h-10 w-full items-center justify-center rounded-2xl text-secondary/80 transition-transform duration-300 hover:scale-95"
        >
          <Component
            src="src/components/shared/icon/twitter-icon.htm"
            class="size-5"
          />
        </button>
      </div>

      <div data-auth-modal-item class="mb-6 flex items-center gap-2">
        <span class="h-px w-full bg-secondary/10"></span>
        <span class="text-tagline-4 shrink-0 text-secondary/50"
          >Or continue with email</span
        >
        <span class="h-px w-full bg-secondary/10"></span>
      </div>

      <form data-auth-email-form data-auth-modal-item class="space-y-4">
        <div class="relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            class="pointer-events-none absolute top-1/2 left-3 size-5 -translate-y-1/2 fill-none stroke-secondary/80"
          >
            <path
              d="M3 7l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <input
            type="email"
            required
            placeholder="name@example.com"
            class="bg-white text-tagline-3 h-11 w-full rounded-full border border-secondary/10 pr-12 pl-10 text-secondary outline-secondary placeholder:text-secondary/60 focus-visible:outline-1"
          />
          <button
            type="submit"
            class="text-secondary group cursor-pointer absolute top-1/2 right-1 flex size-9 -translate-y-1/2 items-center justify-center rounded-full border border-secondary/20 bg-secondary transition-transform duration-300"
          >
            <span class="relative size-5 overflow-hidden">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                class="absolute translate-x-0 transition-transform duration-400 ease-in-out group-hover:translate-x-full size-5 fill-white"
              >
                <path d="M8 5H10V7H8V5Z" />
                <path d="M11 8H13V10H11V8Z" />
                <path d="M14 11H16V13H14V11Z" />
                <path d="M11 14H13V16H11V14Z" />
                <path d="M8 17H10V19H8V17Z" />
              </svg>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                class="absolute -translate-x-full size-5 fill-white transition-transform duration-400 ease-in-out group-hover:translate-x-0"
              >
                <path d="M8 5H10V7H8V5Z" />
                <path d="M11 8H13V10H11V8Z" />
                <path d="M14 11H16V13H14V11Z" />
                <path d="M11 14H13V16H11V14Z" />
                <path d="M8 17H10V19H8V17Z" />
              </svg>
            </span>
          </button>
        </div>
      </form>

      <p
        data-auth-modal-item
        class="text-tagline-3 mt-6 text-center text-secondary/40"
      >
        By clicking continue, you agree to our Terms of Service and Privacy
        Policy.
      </p>
    </div>
  </div>
</div>
